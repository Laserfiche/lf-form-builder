name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ "v$CORE_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match core package version v$CORE_VERSION"
            exit 1
          fi

      - name: Publish @lfz/lf-form-types
        run: npm publish --workspace=packages/lf-form-types --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @lfz/lf-form-builder
        run: npm publish --workspace=packages/core --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
