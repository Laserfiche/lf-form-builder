name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ "v$CORE_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match core package version v$CORE_VERSION"
            exit 1
          fi

      - name: Verify dist contents
        run: |
          echo "Verifying packages/core/dist..."
          if [ ! -f "packages/core/dist/index.js" ]; then
            echo "::error::packages/core/dist/index.js not found"
            exit 1
          fi
          if [ ! -f "packages/core/dist/index.d.ts" ]; then
            echo "::error::packages/core/dist/index.d.ts not found"
            exit 1
          fi
          echo "Verifying packages/types/dist..."
          if [ ! -f "packages/types/lib/index.js" ]; then
            echo "::error::packages/types/lib/index.js not found"
            exit 1
          fi
          if [ ! -f "packages/types/lib/index.d.ts" ]; then
            echo "::error::packages/types/lib/index.d.ts not found"
            exit 1
          fi

      - name: Publish @lf/lf-form-types
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          DIST_TAG="latest"
          if [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            DIST_TAG="$(echo "$TAG" | grep -oE 'beta|rc' | head -1)"
          fi
          npm publish --workspace=packages/types --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @lf/lf-form-builder
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          DIST_TAG="latest"
          if [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            DIST_TAG="$(echo "$TAG" | grep -oE 'beta|rc' | head -1)"
          fi
          npm publish --workspace=packages/core --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
