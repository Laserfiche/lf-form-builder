name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=@lf/lf-form-types
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Check bundle size
        run: |
          CORE_SIZE=$(du -sh packages/core/dist | cut -f1)
          TYPES_SIZE=$(du -sh packages/types/lib | cut -f1)
          echo "Bundle sizes:"
          echo "  @lf/lf-form-builder: $CORE_SIZE"
          echo "  @lf/lf-form-types: $TYPES_SIZE"
          
          # Warn if core bundle > 500KB (adjustable threshold)
          CORE_KB=$(du -sk packages/core/dist | cut -f1)
          if [ "$CORE_KB" -gt 500 ]; then
            echo "::warning::Core bundle size is ${CORE_KB}KB (threshold: 500KB)"
          fi
